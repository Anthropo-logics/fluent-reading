[workspace]
members = ["crates/lectura-cli", "crates/lectura-core", "crates/lectura-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
unicode-normalization = "=0.1.25"
libc = "=0.2.189"
